name: build and release

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    # tags-ignore:
    #   - main
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      -
        name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\//}

      - name: Test version
        run: |
          echo ${{ steps.get_version.outputs.VERSION }}
          echo ${{ github.ref }}

      -
        name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v2
      -
        name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
      -
        name: Inspect builder
        run: |
          echo "Name:      ${{ steps.buildx.outputs.name }}"
          echo "Endpoint:  ${{ steps.buildx.outputs.endpoint }}"
          echo "Status:    ${{ steps.buildx.outputs.status }}"
          echo "Flags:     ${{ steps.buildx.outputs.flags }}"
          echo "Platforms: ${{ steps.buildx.outputs.platforms }}"


      - name: Build dockerfile (with no push)
        run: |
            ver="${{ steps.get_version.outputs.VERSION }}"
            echo "${ver}"
            ./buildx.sh --version ${ver} --push false --repo ${{ secrets.DOCKER_USERNAME }} --image-name passh-static-binaries --docker-file alpine/Dockerfile --platforms "linux/amd64,linux/arm64/v8"
      -
        name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build dockerfile (with push)
        run: |
            echo "Build dockerfile (with push)"
            ver="${{ steps.get_version.outputs.VERSION }}"
            echo "${ver}"
            ./buildx.sh --version ${ver} --push true --repo ${{ secrets.DOCKER_USERNAME }} --image-name passh-static-binaries --docker-file alpine/Dockerfile --platforms "linux/amd64,linux/arm64/v8"


      - name: docker logout
        shell: bash
        run: |
          docker logout
      - name: docker cp binaries
        shell: bash
        run: |
          ver="${{ steps.get_version.outputs.VERSION }}"
          for p in "linux/arm64" "linux/amd64"; do
            docker run --pull always --platform ${p} --name passh-static-binaries -d dyrnq/passh-static-binaries:${ver} sh "tail -f /dev/null"
            docker cp passh-static-binaries:/usr/bin/passh .
            cp ./passh ./passh-${p//\//-}
            docker rm -f passh-static-binaries
          done
          ls -l ./
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # https://github.com/clarkwang/passh
          body: "Release passh ${{ steps.get_version.outputs.VERSION }}.  \n source: https://github.com/clarkwang/passh/releases/tag/${{ steps.get_version.outputs.VERSION }}"
          files: |
            ./passh
            ./passh-linux-amd64
            ./passh-linux-arm64
